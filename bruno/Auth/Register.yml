info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{process.env.APP_URL}}/api/register"
  body:
    type: json
    data: |-
      {
        "name": "John Doe",
        "email": "john@doe.com",
        "password": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
